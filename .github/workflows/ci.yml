name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: meghdrishti
          POSTGRES_PASSWORD: meghdrishti
          POSTGRES_DB: meghdrishti_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U meghdrishti"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://meghdrishti:meghdrishti@localhost:5432/meghdrishti_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-test-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: meghdrishti-backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        working-directory: meghdrishti-backend
        run: ruff check app

      - name: Type-check
        working-directory: meghdrishti-backend
        run: mypy app || true # non-blocking until the codebase is fully annotated

      - name: Unit + integration + API tests
        working-directory: meghdrishti-backend
        run: pytest -q

      - name: Build Docker image
        working-directory: meghdrishti-backend
        run: docker build -t meghdrishti-backend:ci .
