# Round-robin across `api` replicas (docker compose up --scale api=N).
# No sticky cookie / ip_hash — safe because auth is stateless Bearer JWT
# (no server-side session) and WebSocket fan-out goes through Redis
# Pub/Sub, so every replica can serve any request; nothing needs pinning.
#
# Docker's embedded DNS (127.0.0.11) round-robins A records across scaled
# replicas, but nginx only re-resolves a hostname used in a variable —
# a plain `upstream { server api:8000; }` block resolves once at startup
# and would nail every request to whichever replica came up first.
server {
    listen 80;
    resolver 127.0.0.11 valid=10s;

    set $api_upstream http://api:8000;

    location / {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
}
